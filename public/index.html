<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Journal Prompt Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #f3ede4 0%, #e6d9c5 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #3e2f1c;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #7a5230; font-weight: 800; }
  .subtitle { color: #8a7256; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fffaf2;
    border: 2px solid #d8c4a3;
    border-radius: 20px;
    padding: 30px 26px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #d8c4a3;
    background: #fff;
    color: #3e2f1c;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #7a5230;
    color: #fff;
    box-shadow: 0 5px 0 #4f341c;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #4f341c; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #8a7256; min-height: 1.2em; }
  .result-body { font-size: 1.15rem; line-height: 1.6; margin: 20px 0 4px; color: #3e2f1c; font-weight: 600; }
  .footer-note { color: #8a7256; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #e6d9c5;
    border-top-color: #7a5230;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📔</div>
    <h1>Journal Prompt Generator</h1>
    <p class="subtitle">Enter a mood or topic, get a reflective journal prompt to write from. 100% on-device.</p>

    <div class="card">
      <input type="text" id="mainInput" placeholder="e.g. feeling stuck, starting a new chapter, homesick" />
      <button class="action" id="generateBtn">Get My Prompt</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Thinking of a prompt...';

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ moodOrTopic: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-body">${escapeHtml(data.prompt)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
